<!DOCTYPE html>
<html>
<head>
  <!-- 🏆 STRICT COMPILER CONSTRAINT MATCHED -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Tournament Manager Web Application">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="tournament_manager">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>Tournament Manager</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png"/>
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: #03040B; /* Strict application surface match */
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <!-- 🏆 THE 100% BLACK SCREEN CURE FOR NEW BOOTSTRAP GENERATIONS -->
  <script>
    window.addEventListener('load', function(ev) {
      // Direct integration configuration to prevent graphics pipeline locks
      if (window._flutter && window._flutter.loader) {
        window._flutter.loader.loadEntrypoint({
          onEntrypointLoaded: function(engineInitializer) {
            engineInitializer.initializeEngine({
              renderer: "html" // Safe rendering engine forced
            }).then(function(appRunner) {
              appRunner.runApp();
            });
          }
        });
      } else {
        // Fallback injection block if loader pipeline delays
        window.flutterConfiguration = {
          renderer: "html"
        };
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
