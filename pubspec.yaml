version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  http: ^1.0.0
  shared_preferences: ^2.5.5 # 🏆 Kept here cleanly

  cupertino_icons: ^1.0.8

